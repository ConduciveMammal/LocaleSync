name: Publish to npm

on:
  push:
    branches:
      - main

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'ConduciveMammal/LocaleSync'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Check whether version is already published
        id: version
        shell: bash
        run: |
          package_name=$(node --input-type=module -e "import packageJson from './package.json' with {type: 'json'}; console.log(packageJson.name)")
          package_version=$(node --input-type=module -e "import packageJson from './package.json' with {type: 'json'}; console.log(packageJson.version)")

          set +e
          npm_output=$(npm view "${package_name}@${package_version}" version 2>&1)
          npm_status=$?
          set -e

          if [[ $npm_status -eq 0 ]]; then
            echo "${package_name}@${package_version} is already published."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif [[ $npm_output == *"E404"* ]]; then
            echo "${package_name}@${package_version} is new."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$npm_output" >&2
            exit "$npm_status"
          fi

      - name: Publish package
        if: steps.version.outputs.should_publish == 'true'
        run: npm publish --access public
